<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07070c" />
    <title>Deepcore</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07070c; overflow: hidden; }
      html, body, #game { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { width: 100%; height: 100%; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #07070c; color: #7fe3ff;
        font: 600 20px/1.4 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      /* Phones held upright: the game is landscape only. */
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Ruota il telefono in orizzontale<br />Rotate your phone to landscape</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
